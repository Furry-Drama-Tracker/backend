# =============================================================================
# neo-server 配置模板
# 复制到 OS 对应的默认路径并填写。文件权限建议 600（含密钥）。
#   Linux:   /etc/furry-drama-tracker/backend.ini
#   macOS:   /Library/Application Support/furry-drama-tracker/backend.ini
#   Windows: C:\ProgramData\furry-drama-tracker\backend.ini
# 同名环境变量优先于 ini（供 systemd 注入）。
# =============================================================================

[server]
# 监听地址：tcp:HOST:PORT 或 unix:/run/furry-drama-be-neo.sock（"@name" 为 abstract）
listen = tcp:127.0.0.1:5000
# development | production
node_env = production
# 前端地址（邮件链接/CORS 白名单）
frontend_url = https://example.com
site_url = https://example.com
# 上传目录（相对或绝对路径）
uploads_dir = /var/www/furry-drama-tracker/uploads
# 额外允许的 CORS 源（逗号分隔，追加在默认 localhost 白名单之后）
allow_origins = https://example.com
# 是否信任反向代理标头识别客户端 IP（限流/审计/登录记录均依赖）。
# 缺省跟随 node_env：生产=信任、开发=不信任。显式 true/false 覆盖。
# trust_proxy_headers = true
# 代理标头清单（逗号分隔，按序取首个有效 IP）。
# 缺省 CF-Connecting-IP,X-Real-IP,X-Forwarded-For：
#   - CF-Connecting-IP 最优先：本项目经阿里云 ESA 回源，已在 ESA「托管转换 →
#     添加真实客户端 IP 标头」以该名字边缘覆盖写入真实访客 IP；
#   - X-Real-IP 仅作兜底（本机反代写出的值是它看到的对端，经 ESA 时=节点 IP）。
# proxy_ip_headers = CF-Connecting-IP,X-Real-IP,X-Forwarded-For
# 受信代理来源（IP/CIDR，逗号分隔）。缺省不配=信任全部来源（不校验请求来源）。
# 当前拓扑（ESA → 本机反代 → Go）建议填本机反代回环地址，直连伪造标头即被忽略：
# trusted_proxies = 127.0.0.1, ::1
# 若 ESA 直连 Go（无本机反代），应填 ESA 回源 IP 段。
# 单一无条件最高优先标头（不校验来源与格式，非空即信）。
# 仅应在前置网关保证覆盖写入该头时启用，一般留空（走 proxy_ip_headers 即可）。
# proxy_trusted_platform =

[database]
uri = mongodb://127.0.0.1:27017/furry_drama_tracker
# 库名（留空从 uri 提取）
name =
# 连接池
pool_size = 10

[jwt]
# 必须填写随机生成的高强度密钥（至少 32 字符）；留空或过短会拒绝启动。
# 示例/历史弱密钥仅告警不阻止启动，便于已有服务平滑升级，但应尽快轮换。
secret =
# 字段加密密钥（AES-256-CBC，建议与 secret 不同；缺省回退 secret 以兼容旧数据）
encryption_key =
# ALTCHA HMAC 密钥（缺省由 secret 派生 sha256("altcha-"+secret)）
altcha_hmac_key =
# access/refresh 令牌有效期（Go duration 语法）
access_ttl = 15m
refresh_ttl = 168h
# 开发/测试 API 口令（X-Dev-Token 头，绕过 altcha/邮箱/设备验证；生产留空）
dev_api_token =
# 跳过新设备/邮箱验证的邮箱列表（逗号分隔；仅 node_env != production 生效）
demo_emails =

[email]
host = smtp.example.com
port = 465
user = noreply@example.com
pass =
from_name = 兽剧聚合平台

[vapid]
public_key =
private_key =
subject = mailto:admin@example.com

[webauthn]
; Passkey（WebAuthn）配置；留空时 rp_id/origins 从 [server] 的 frontend_url/site_url
; 域名推导，开发环境自动追加 localhost:3000-3002。
; Relying Party ID：站点裸域名（不含 scheme/端口），Passkey 只在该域名（含子域）下有效。
rp_id =
; 注册时展示给用户的站点名（缺省用 [email].from_name 或域名）
rp_name =
; 允许的仪式来源（逗号分隔完整 origin，如 https://example.com）
origins =

[oauth]
; QQ 互联（预留）：配置后才视为启用；当前后端实现返回 501，待接入 SDK。
qq_app_id =
qq_app_key =

[security]
login_max_attempts = 5
login_lock_minutes = 30
csrf_max_age_h = 24
; 用户名（登录名）黑名单补充词表（逗号分隔，与内置词表合并做子串匹配：
; 用户名包含任一关键词即拒绝；内置已含 admin/root/system/api 等）。
username_blacklist =
; 改名冷却天数（默认 7）
login_name_cooldown_days = 7
; 旧用户名保留天数（默认 90，期间他人不可注册该名）
login_name_reserve_days = 90
; IP → 地域解析（登录/注册/设备记录与提醒邮件）。默认 false：该能力会把客户端 IP
; 发给所选数据源（ADR-017/ADR-018）。aliyun=阿里云云市场纯真 API（AppCode 鉴权，
; 境内服务）；czdb=纯真离线库（本地查询，无外呼）。未显式开启时保持关闭。
ip_region_enabled = false
; 首选数据源：aliyun（默认）或 czdb；另一数据源配置齐全时自动兜底（ADR-018）。
ip_region_provider = aliyun
; 阿里云云市场纯真 IP 地域 API（cmapi00053387）的 AppCode。
; https://market.aliyun.com/detail/cmapi00053387 购买后在云市场控制台获取。
ip_region_appcode =
; 纯真离线库（czdb）IPv4/IPv6 库文件路径（.czdb，需先解压官方发布的压缩包）
; 与解密密钥（随库文件由纯真官方提供，两库共用）。本地查询无网络外呼；
; 仅配其中一个协议时另一协议 IP 记 "未知"（可由 aliyun 数据源兜底）。
ip_region_czdb_path_v4 =
ip_region_czdb_path_v6 =
ip_region_czdb_key =
