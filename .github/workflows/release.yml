name: release

# 滚动发布：每次推送先跑 test job（go vet + go test -count=1，集成测试的
# mongod 127.0.0.1:27017 由 service 容器提供，镜像 mongo:8 对齐本地 v8.3；
# 测试使用独立 neo_*_test 库，不依赖任何环境变量），通过后才构建 8 目标
# 无 CGO 二进制；main 分支推送把产物覆盖发布到 tag=latest 的 Release
# （先删后建，/releases/latest 永远指向最新构建）。
# 构建参数与 make release 一致：-trimpath -ldflags "-s -w"（剥离符号与调试信息）。
# Windows 产物自动链接仓库内 cmd/server/rsrc_windows_*.syso（应用图标+版本元数据）。
# CI 干净检出使 Go 自动烙入 vcs.revision，无 +dirty；产物随代码变化，构建可复现。

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        # -count=1：禁用测试结果缓存（GOCACHE 会被 setup-go 跨 run 缓存），
        # 保证每次发布门禁都是真实执行。
        run: go test -count=1 ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: "386" }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: "386" }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }   # macOS 不构建 32 位
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          EXT=$([ "${{ matrix.goos }}" = windows ] && echo .exe || true)
          go build -trimpath -ldflags "-s -w" \
            -o "dist/furry-drama-be-neo-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" \
            ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: furry-drama-be-neo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    # 仅 main 的推送覆盖发布；其他分支只构建不发布
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: cd dist && sha256sum * > checksums.txt
      - name: Replace rolling release (tag latest)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          gh release create latest dist/* \
            --title "latest"
