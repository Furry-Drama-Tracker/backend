basePath: /api
definitions:
  auth.DeviceInfoPayload:
    properties:
      browser:
        type: string
      browserVersion:
        type: string
      carrier:
        type: string
      deviceModel:
        type: string
      deviceType:
        type: string
      language:
        type: string
      os:
        type: string
      osVersion:
        type: string
      screenHeight:
        type: integer
      screenWidth:
        type: integer
    type: object
  handler.loginRequest:
    properties:
      altcha:
        type: string
      deviceInfo:
        $ref: '#/definitions/auth.DeviceInfoPayload'
      email:
        type: string
      password:
        type: string
    type: object
  handler.registerRequest:
    properties:
      accountId:
        type: string
      altcha:
        type: string
      deviceInfo:
        $ref: '#/definitions/auth.DeviceInfoPayload'
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  model.Folder:
    properties:
      _id:
        type: string
      createdAt:
        type: string
      description:
        type: string
      name:
        type: string
      shareToken:
        description: ShareToken 分享令牌；未分享时为 nil（JSON 输出 null，与既有数据缺省形态一致）。
        type: string
      sortOrder:
        type: integer
      type:
        type: string
      userId:
        type: string
    type: object
  model.SavedFolder:
    properties:
      _id:
        type: string
      createdAt:
        type: string
      creatorId:
        type: string
      creatorName:
        type: string
      description:
        type: string
      folderName:
        type: string
      folderType:
        type: string
      shareToken:
        type: string
      userId:
        type: string
    type: object
  model.Series:
    properties:
      _id:
        type: string
      createdAt:
        type: string
      createdBy:
        type: string
      description:
        type: string
      descriptionEn:
        type: string
      descriptionJa:
        type: string
      episodes:
        items:
          type: string
        type: array
      name:
        type: string
      nameEn:
        type: string
      nameJa:
        type: string
      updatedAt:
        type: string
    type: object
  model.Wallpaper:
    properties:
      addedAt:
        type: string
      name:
        type: string
      url:
        type: string
    type: object
  pagination.Result:
    properties:
      limit:
        type: integer
      list: {}
      page:
        type: integer
      total:
        type: integer
      totalPages:
        type: integer
    type: object
host: localhost:5000
info:
  contact: {}
  description: 兽剧内容聚合平台后端服务 API 文档（neo-server）
  title: 兽剧聚合平台 API
  version: 1.0.0
paths:
  /2fa/disable:
    post:
      consumes:
      - application/json
      parameters:
      - description: TOTP 或备份码
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - bearerAuth: []
      summary: 关闭 2FA
      tags:
      - 2FA
  /2fa/enable:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: secret/backupCodes/otpauthUrl
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: 开启 2FA（生成密钥）
      tags:
      - 2FA
  /2fa/verify:
    post:
      consumes:
      - application/json
      parameters:
      - description: TOTP 或备份码
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: verified
          schema:
            additionalProperties:
              type: boolean
            type: object
      security:
      - bearerAuth: []
      summary: 校验 2FA 码
      tags:
      - 2FA
  /2fa/verify-enable:
    post:
      consumes:
      - application/json
      parameters:
      - description: TOTP 码
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - bearerAuth: []
      summary: 确认开启 2FA
      tags:
      - 2FA
  /activity:
    get:
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: limit
        type: integer
      responses:
        "200":
          description: activities/page/limit/total/totalPages
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: 我的动态流
      tags:
      - 动态
  /activity/public:
    get:
      responses:
        "200":
          description: activities/total
          schema:
            additionalProperties: true
            type: object
      summary: 公开动态流
      tags:
      - 动态
  /admin/{id}:
    delete:
      parameters:
      - description: 账户 ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 不能删除自己/最后一个超管/非管理账户
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 账户不存在
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: 删除管理/创作者账户
      tags:
      - 管理后台
  /admin/creator-profiles:
    get:
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      security:
      - bearerAuth: []
      summary: 创作者主页列表（含创作者用户信息）
      tags:
      - 管理后台
  /admin/creator-profiles/{id}:
    get:
      parameters:
      - description: 主页 ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 创作者主页不存在
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: 创作者主页详情
      tags:
      - 管理后台
    put:
      consumes:
      - application/json
      parameters:
      - description: 主页 ID
        in: path
        name: id
        required: true
        type: string
      - description: displayName/avatar/bio/socialLinks/qqGroupLink
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 创作者主页不存在
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: 编辑创作者主页
      tags:
      - 管理后台
  /admin/creator-profiles/{id}/approve:
    put:
      parameters:
      - description: 主页 ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 创作者主页不存在
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: 通过创作者主页修改
      tags:
      - 管理后台
  /admin/creator-profiles/{id}/reject:
    put:
      consumes:
      - application/json
      parameters:
      - description: 主页 ID
        in: path
        name: id
        required: true
        type: string
      - description: note
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 创作者主页不存在
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: 拒绝创作者主页修改
      tags:
      - 管理后台
  /admin/creators:
    get:
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      security:
      - bearerAuth: []
      summary: 创作者列表
      tags:
      - 管理后台
  /admin/list:
    get:
      parameters:
      - description: 页码（默认 1）
        in: query
        name: page
        type: integer
      - description: 每页数量（默认 20，上限 100）
        in: query
        name: limit
        type: integer
      responses:
        "200":
          description: list/page/limit/total/totalPages
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: 管理/创作者账户列表
      tags:
      - 管理后台
  /admin/logout:
    post:
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - bearerAuth: []
      summary: 管理员退出登录
      tags:
      - 管理后台
  /admin/pending-counts:
    get:
      responses:
        "200":
          description: episodes/reports/feedbacks/friendLinks
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: 待办数量统计
      tags:
      - 管理后台
  /admin/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: username/email/password/role/accountId
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: 用户对象 + message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 校验失败
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: 创建管理/创作者账户
      tags:
      - 管理后台
  /admin/role/{id}:
    put:
      consumes:
      - application/json
      parameters:
      - description: 账户 ID
        in: path
        name: id
        required: true
        type: string
      - description: role
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: 用户对象
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 无效的角色/不能修改自己/最后一个超管
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 账户不存在
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: 修改账户角色
      tags:
      - 管理后台
  /admin/user-admin-access/{id}:
    put:
      consumes:
      - application/json
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: string
      - description: adminAccess
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: message/adminAccess/role
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 参数错误/不能修改超管或创作者权限
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 用户不存在
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: 切换用户管理权限
      tags:
      - 管理后台
  /admin/users:
    get:
      parameters:
      - description: 页码（默认 1）
        in: query
        name: page
        type: integer
      - description: 每页数量（默认 20，上限 200）
        in: query
        name: limit
        type: integer
      - description: 关键词（accountId/username/email）
        in: query
        name: search
        type: string
      responses:
        "200":
          description: list/page/limit/total/totalPages
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: 用户列表
      tags:
      - 管理后台
  /admin/users/{id}:
    delete:
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 不能删除自己/最后一个超管
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 用户不存在
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: 删除用户（级联清理）
      tags:
      - 管理后台
  /admin/verify:
    get:
      responses:
        "200":
          description: valid/admin
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: 校验管理令牌有效性
      tags:
      - 管理后台
  /admin/verify-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: password
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: verified
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: 请输入密码/密码错误
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 未找到
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: 校验管理员密码
      tags:
      - 管理后台
  /announcements:
    get:
      responses:
        "200":
          description: 公告列表（createdAt 倒序）
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      security:
      - bearerAuth: []
      summary: 公告列表（管理后台）
      tags:
      - 公告
    post:
      consumes:
      - application/json
      parameters:
      - description: title/content 必填；其余字段可选
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: 公告对象
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 标题和内容不能为空
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - bearerAuth: []
      summary: 创建公告
      tags:
      - 公告
  /announcements/{id}:
    delete:
      parameters:
      - description: 公告 ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: 已删除
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Announcement not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - bearerAuth: []
      summary: 删除公告
      tags:
      - 公告
    get:
      parameters:
      - description: 公告 ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: 公告对象
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Announcement not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 获取公告详情
      tags:
      - 公告
    put:
      consumes:
      - application/json
      parameters:
      - description: 公告 ID
        in: path
        name: id
        required: true
        type: string
      - description: 可更新字段
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: 公告对象
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Announcement not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - bearerAuth: []
      summary: 更新公告
      tags:
      - 公告
  /announcements/{id}/send-email:
    post:
      parameters:
      - description: 公告 ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: message/sent
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 该公告未启用邮件推送
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Announcement not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - bearerAuth: []
      summary: 手动触发公告邮件推送
      tags:
      - 公告
  /announcements/{id}/send-notification:
    post:
      parameters:
      - description: 公告 ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: message/count
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 该公告未启用通知推送
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Announcement not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - bearerAuth: []
      summary: 手动触发公告通知推送
      tags:
      - 公告
  /announcements/active:
    get:
      parameters:
      - description: 渠道过滤 popup|banner
        in: query
        name: channel
        type: string
      responses:
        "200":
          description: 公告列表（≤20）
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      summary: 获取生效中的公告
      tags:
      - 公告
  /audit-logs:
    get:
      parameters:
      - description: 页码（默认 1）
        in: query
        name: page
        type: integer
      - description: 每页数量（默认 50）
        in: query
        name: limit
        type: integer
      - description: 操作关键词
        in: query
        name: action
        type: string
      - description: 操作者昵称关键词
        in: query
        name: admin
        type: string
      - description: 被操作用户关键词
        in: query
        name: user
        type: string
      responses:
        "200":
          description: logs/total/page/totalPages
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: 审计日志列表
      tags:
      - 审计日志
  /auth/cancel-deletion:
    post:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - bearerAuth: []
      summary: 取消注销申请
      tags:
      - 认证
  /auth/captcha:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 挑战参数与签名
          schema:
            additionalProperties: true
            type: object
      summary: 获取验证码挑战
      tags:
      - 认证
  /auth/change-email:
    put:
      consumes:
      - application/json
      parameters:
      - description: newEmail/password
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: 修改绑定邮箱（超管）
      tags:
      - 认证
  /auth/change-password:
    put:
      consumes:
      - application/json
      parameters:
      - description: currentPassword/newPassword
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - bearerAuth: []
      summary: 修改密码
      tags:
      - 认证
  /auth/check-accountId:
    get:
      parameters:
      - description: 账号ID
        in: query
        name: accountId
        required: true
        type: string
      responses:
        "200":
          description: available
          schema:
            additionalProperties:
              type: boolean
            type: object
      summary: 检查账号ID是否可用
      tags:
      - 认证
  /auth/confirm-device-login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 6 位登录码
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 用户对象或 need2FA
          schema:
            additionalProperties: true
            type: object
      summary: 确认设备登录
      tags:
      - 认证
  /auth/deletion-status:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: 注销申请状态
      tags:
      - 认证
  /auth/email-notification-prefs:
    put:
      consumes:
      - application/json
      parameters:
      - description: 7 个布尔偏好键
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - bearerAuth: []
      summary: 更新邮件通知偏好
      tags:
      - 认证
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: email/altcha
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 忘记密码
      tags:
      - 认证
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登录信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 用户对象或 need2FA
