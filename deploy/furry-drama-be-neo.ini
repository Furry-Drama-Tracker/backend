# =============================================================================
# neo-server 配置模板
# 复制到 OS 对应的默认路径并填写。文件权限建议 600（含密钥）。
#   Linux:   /etc/furry-drama-tracker/backend.ini
#   macOS:   /Library/Application Support/furry-drama-tracker/backend.ini
#   Windows: C:\ProgramData\furry-drama-tracker\backend.ini
# 同名环境变量优先于 ini（供 systemd 注入）。
# =============================================================================

[server]
# 监听地址：tcp:HOST:PORT 或 unix:/run/furry-drama-be-neo.sock（"@name" 为 abstract）
listen = tcp:127.0.0.1:5000
# development | production
node_env = production
# 前端地址（邮件链接/CORS 白名单）
frontend_url = https://example.com
site_url = https://example.com
# 上传目录（相对或绝对路径）
uploads_dir = /var/www/furry-drama-tracker/uploads
# 额外允许的 CORS 源（逗号分隔，追加在默认 localhost 白名单之后）
allow_origins = https://example.com
# 是否信任反向代理标头识别客户端 IP（限流/审计/登录记录均依赖）。
# 缺省跟随 node_env：生产=信任、开发=不信任。显式 true/false 覆盖。
# trust_proxy_headers = true
# 代理标头清单（逗号分隔，按序取首个有效 IP）。
# 缺省 CF-Connecting-IP,X-Real-IP,X-Forwarded-For：
#   - CF-Connecting-IP 最优先：本项目经阿里云 ESA 回源，已在 ESA「托管转换 →
#     添加真实客户端 IP 标头」以该名字边缘覆盖写入真实访客 IP；
#   - X-Real-IP 仅作兜底（本机反代写出的值是它看到的对端，经 ESA 时=节点 IP）。
# proxy_ip_headers = CF-Connecting-IP,X-Real-IP,X-Forwarded-For
# 受信代理来源（IP/CIDR，逗号分隔）。缺省不配=信任全部来源（不校验请求来源）。
# 当前拓扑（ESA → 本机反代 → Go）建议填本机反代回环地址，直连伪造标头即被忽略：
# trusted_proxies = 127.0.0.1, ::1
# 若 ESA 直连 Go（无本机反代），应填 ESA 回源 IP 段。
# 单一无条件最高优先标头（不校验来源与格式，非空即信）。
# 仅应在前置网关保证覆盖写入该头时启用，一般留空（走 proxy_ip_headers 即可）。
# proxy_trusted_platform =

[database]
uri = mongodb://127.0.0.1:27017/furry_drama_tracker
# 库名（留空从 uri 提取）
name =
# 连接池
pool_size = 10

[jwt]
# 必须填写随机生成的高强度密钥（至少 32 字符）；留空或过短会拒绝启动。
# 示例/历史弱密钥仅告警不阻止启动，便于已有服务平滑升级，但应尽快轮换。
secret =
# 字段加密密钥（AES-256-CBC，建议与 secret 不同；缺省回退 secret 以兼容旧数据）
encryption_key =
# ALTCHA HMAC 密钥（缺省由 secret 派生 sha256("altcha-"+secret)）
altcha_hmac_key =
# access/refresh 令牌有效期（Go duration 语法）
access_ttl = 15m
refresh_ttl = 168h
# 开发/测试 API 口令（X-Dev-Token 头，绕过 altcha/邮箱/设备验证；生产留空）
dev_api_token =
# 跳过新设备/邮箱验证的邮箱列表（逗号分隔；仅 node_env != production 生效）
demo_emails =

[email]
host = smtp.example.com
port = 465
user = noreply@example.com
pass =
from_name = 兽剧聚合平台

[vapid]
public_key =
private_key =
subject = mailto:admin@example.com

[security]
login_max_attempts = 5
login_lock_minutes = 30
csrf_max_age_h = 24
